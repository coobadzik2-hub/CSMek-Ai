services:
  - type: web
    name: csmek
    runtime: python
    buildCommand: pip install -r web_app/requirements.txt
    startCommand: uvicorn web_app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini